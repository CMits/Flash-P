<!DOCTYPE html>
<!--
  FLASH-P Studio — generated by network_to_studio.py.
  A single self-contained app embedding ALL of your built networks. Three views:
    • Browse   — pick a network
    • View     — interactive Cytoscape graph; click a node for its function + edge DOIs
    • Simulate — perturbate the network (KO/KD/OE + treatments), three solvers, live charts
  Faithful port of the website (FLASHP_WEBSITE/Flash-P-AI). No server, no install:
  open by double-click. Markers FLASHP_LIBS / FLASHP_GRAPH_JS / FLASHP_SIM_JS /
  FLASHP_CHART_JS / FLASHP_DATA / FLASHP_TITLE are substituted by the Python generator.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FLASH-P Studio · <!--FLASHP_TITLE--></title>
  <style>
    :root {
      --bg: #fdf8f3; --fg: #221a14; --muted: #847b73; --card: #fffdfb;
      --border: #e6ddd3; --grid: #ece4da; --accent: #d14600;
      --primary: #d14600; --primary-fg: #fdf8f3; --secondary: #f1e9e1; --ring: #d14600;
      --destructive: #dc2626; --pos: #2c7fb8; --neg: #d7301f;
      /* Evidence borrowed from another organism — a caution, not an error, so amber
         rather than the destructive red used for failures. */
      --warn: #b45309;
    }
    html.dark {
      --bg: hsl(192 32% 7%); --fg: #e9efe9; --muted: #93a7a0; --card: #11242a;
      --border: #24383f; --grid: rgba(120,150,140,0.16); --accent: #ff7a1a;
      --primary: #ff7a1a; --primary-fg: #11242a; --secondary: #1b2e34; --ring: #ff7a1a;
      --warn: #fbbf24;                 /* lifted for contrast on the dark card */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif; color: var(--fg);
      background: var(--bg); font-size: 14px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    a { color: inherit; }
    button { font-family: inherit; }
    .btn {
      border: 1px solid var(--border); background: var(--card); color: var(--fg);
      border-radius: 6px; cursor: pointer; font-size: 12.5px; padding: 6px 10px;
    }
    .btn:hover { border-color: var(--primary); }
    .btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); font-weight: 600; }
    .btn.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .chip {
      font-size: 10.5px; padding: 1px 8px; border-radius: 999px;
      background: var(--secondary); color: var(--fg);
    }
    input, select {
      border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      border-radius: 6px; padding: 6px 8px; font-size: 13px; outline: none;
    }
    input:focus, select:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring) 35%, transparent); }
    .uplabel { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

    /* ---- hover info tooltips ---- */
    .info {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; border-radius: 999px; border: 1px solid var(--muted);
      color: var(--muted); font-size: 9.5px; font-style: normal; font-weight: 700;
      line-height: 1; cursor: help; position: relative; vertical-align: middle;
      margin-left: 5px; text-transform: none; letter-spacing: 0;
    }
    .info:hover { color: var(--primary); border-color: var(--primary); }
    .info::after {
      content: attr(data-tip);
      position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%);
      width: 240px; max-width: 62vw; background: var(--card); color: var(--fg);
      border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
      font-size: 11.5px; font-weight: 400; line-height: 1.5; text-align: left;
      box-shadow: 0 6px 18px rgba(0,0,0,.16); z-index: 60;
      opacity: 0; visibility: hidden; transition: opacity .12s; pointer-events: none; white-space: normal;
    }
    /* CSS ::after tooltip is replaced by a position:fixed floating tip in JS (escapes overflow clipping). */
    .info::after { display: none; }

    /* ---- top bar ---- */
    #topbar {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      border-bottom: 1px solid var(--border); background: var(--card); flex: none;
    }
    #topbar .brand { font-weight: 700; font-size: 15px; }
    #topbar .brand .flask { color: var(--primary); }
    #topbar .crumb { color: var(--muted); font-size: 13px; }
    #topbar .spacer { flex: 1; }
    #topbar .navbtns { display: flex; gap: 6px; }

    main { flex: 1; min-height: 0; overflow: hidden; position: relative; }
    .view { position: absolute; inset: 0; display: none; }
    .view.show { display: block; }

    /* ---- browse ---- */
    #view-browse { overflow: auto; }
    .browse-head { padding: 18px 22px 12px; }
    .browse-head h1 { font-size: 21px; margin: 0 0 2px; }
    .browse-head .sub { color: var(--muted); font-size: 13px; }
    .filterbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 0 22px 14px; border-bottom: 1px solid var(--border); }
    .filterbar .search { position: relative; flex: 1; min-width: 200px; max-width: 380px; display: flex; align-items: center; }
    .filterbar .search svg { position: absolute; left: 10px; opacity: .5; pointer-events: none; }
    .filterbar .search input { width: 100%; padding-left: 31px; border-radius: 10px; }
    .filterbar select { min-width: 150px; border-radius: 10px; cursor: pointer; }
    .filterbar .count { margin-left: auto; color: var(--muted); font-size: 12px; }
    .filterbar .count b { color: var(--fg); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; padding: 20px 22px; align-content: start; }
    @media (min-width: 1500px) { .cards { grid-template-columns: repeat(4, 1fr); } }
    .card {
      position: relative; border: 1px solid var(--border); background: var(--card);
      border-radius: 16px; overflow: hidden; cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .card:hover {
      transform: translateY(-2px); box-shadow: 0 12px 26px rgba(0,0,0,.09);
      border-color: color-mix(in srgb, var(--primary) 32%, transparent);
    }
    .card-stripe { height: 4px; width: 100%; }
    .card-body { padding: 18px; }
    .card-top { display: flex; align-items: flex-start; gap: 12px; }
    .card-icon { width: 44px; height: 44px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; transition: transform .2s; }
    .card:hover .card-icon { transform: scale(1.1); }
    .card-titles { min-width: 0; flex: 1; padding-top: 1px; }
    .card-titles h3 { margin: 0; font-size: 14px; font-weight: 700; text-transform: capitalize; line-height: 1.25; transition: color .15s;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card:hover .card-titles h3 { color: var(--primary); }
    .card-sp { font-size: 12px; font-style: italic; opacity: .85; margin-top: 2px; }
    .card-acc { font-size: 14px; font-weight: 800; flex: none; font-variant-numeric: tabular-nums; }
    .card-stats { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding-top: 11px;
      border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent); font-size: 11px; color: var(--muted); }
    .card-stats .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; margin-right: 5px; vertical-align: middle; }
    .card-stats .dot.blue { background: #60a5fa; } .card-stats .dot.green { background: #4ade80; }
    .card-sim { margin-left: auto; border: 1px solid var(--border); background: var(--card); color: var(--primary);
      border-radius: 7px; padding: 3px 9px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all .15s; }
    .card-sim:hover { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .card-hint { text-align: center; margin-top: 10px; font-size: 10px; font-weight: 600; color: var(--primary); opacity: 0; transition: opacity .2s; }
    .card:hover .card-hint { opacity: .85; }
    .browse-empty { padding: 40px 22px; color: var(--muted); }

    /* ---- graph canvases ---- */
    .cy { position: absolute; inset: 0; background-color: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0);
      background-size: 22px 22px; }
    .panelbar {
      position: absolute; z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      padding: 5px; border: 1px solid var(--border); background: var(--card);
      border-radius: 9px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .toolbar select, .toolbar button {
      height: 30px; border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      border-radius: 6px; cursor: pointer; font-size: 12.5px; padding: 0 8px;
    }
    .toolbar button { width: 32px; padding: 0; font-size: 15px; line-height: 1; }
    .toolbar button.active { background: var(--border); }
    .toolbar .sep { width: 1px; align-self: stretch; background: var(--border); margin: 2px 1px; }
    .legend { flex-direction: column; align-items: flex-start; font-size: 12px; }
    .legend h4 { margin: 2px 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .legend .sw { width: 13px; height: 13px; border-radius: 3px; flex: none; }
    .legend .ln { width: 18px; height: 0; border-top-width: 2px; border-top-style: solid; flex: none; }
    .nodepanel {
      position: absolute; z-index: 6; overflow: auto; padding: 14px;
      border: 1px solid var(--border); background: var(--card); border-radius: 11px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12); display: none; font-size: 13px; line-height: 1.45;
    }
    .nodepanel.show { display: block; }
    .nodepanel .close { float: right; cursor: pointer; color: var(--muted); border: none; background: none; font-size: 18px; }
    .nodepanel h2 { margin: 0 0 2px; font-size: 17px; }
    .nodepanel .ty { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .nodepanel .badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--secondary); margin-left: 6px; vertical-align: middle; }
    .nodepanel .fn { margin: 6px 0 10px; }
    .nodepanel .desc { color: var(--muted); margin: 0 0 12px; }
    .nodepanel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 5px; }
    .nodepanel ul { list-style: none; margin: 0; padding: 0; }
    .nodepanel li { margin: 4px 0; }
    .nodepanel .arrow { font-weight: 700; }
    .nodepanel a { text-decoration: none; border-bottom: 1px dotted currentColor; font-size: 11.5px; }
    .nodepanel .nodoi { color: var(--muted); font-size: 11.5px; }

    /* ---- view layout ---- */
    #view-view .graphwrap { position: absolute; inset: 0; }
    #view-view .toolbar { left: 12px; top: 12px; max-width: calc(100% - 24px); }
    #view-view .vtitle {
      position: absolute; right: 12px; top: 12px; z-index: 5; max-width: 44%;
      padding: 7px 11px; border: 1px solid var(--border); background: var(--card);
      border-radius: 9px; box-shadow: 0 1px 3px rgba(0,0,0,.08); font-size: 12.5px;
    }
    #view-view .vtitle b { font-size: 13.5px; } #view-view .vtitle .sp { color: var(--muted); font-style: italic; }
    #view-view .legend { left: 12px; bottom: 12px; }
    #view-view .nodepanel { right: 12px; top: 108px; bottom: 12px; width: 320px; max-width: calc(100% - 24px); }
    #view-view .simbtn { display: block; width: 100%; margin-top: 9px; }

    /* ---- simulate layout ---- */
    #view-sim { display: none; }
    #view-sim.show { display: flex; flex-direction: column; }
    .sim-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--card); flex: none; }
    .sim-bar .flask { color: var(--primary); }
    .sim-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 310px minmax(300px, 1fr) minmax(340px, 1.2fr); gap: 12px; padding: 12px; overflow: hidden; }
    @media (max-width: 1000px) { .sim-grid { grid-template-columns: 1fr; overflow: auto; } }
    .pane { border: 1px solid var(--border); background: var(--card); border-radius: 11px; }
    .builder { padding: 14px; overflow: auto; }
    .builder .group { margin-bottom: 14px; }
    .builder .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .builder .addrow { display: flex; gap: 6px; }
    .builder .addrow input { flex: 1; min-width: 0; }
    .builder .iconbtn { width: 34px; flex: none; }
    .pertrow { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; margin-top: 5px; }
    .pertrow .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .pertrow .rm { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 14px; }
    .net-pane { position: relative; overflow: hidden; }
    .net-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .net-canvaswrap { position: absolute; top: 38px; inset: 0 0 0 0; }
    .actioncard { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--card) 95%, transparent); padding: 10px 12px; backdrop-filter: blur(3px); display: none; }
    .actioncard.show { display: block; }
    .actioncard .acbtns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .results { overflow: auto; padding: 0; }
    .results .inner { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .empty { height: 100%; min-height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 11px; margin: 14px; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px 22px; border: 1px solid var(--border); border-radius: 11px; padding: 14px; }
    .summary .cell .k { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
    .summary .cell .v { font-size: 15px; font-weight: 700; }
    .ymodes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
    .ymodes .pill { border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; cursor: pointer; font-weight: 600; }
    .ymodes .pill.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .block { border: 1px solid var(--border); border-radius: 11px; padding: 14px; }
    .block h3 { margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .ntable { width: 100%; }
    .ntable .head, .ntable .trow { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; }
    .ntable .head { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--border); padding: 0 6px 4px; }
    .ntable .scroll { max-height: 320px; overflow: auto; }
    .ntable .trow { padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: right; }
    .ntable .trow:hover { background: var(--secondary); }
    .ntable .trow.sel { background: color-mix(in srgb, var(--secondary) 80%, transparent); }
    .ntable .trow .name { text-align: left; display: flex; align-items: center; gap: 6px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .ntable .dot { width: 8px; height: 8px; border-radius: 999px; border: 1px solid var(--muted); flex: none; }
    .ntable .dot.on { background: var(--primary); border-color: var(--primary); }
    .footnote { font-size: 11px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }

    /* ---- evidence drawer ----
       Slide-over showing the paper behind a claim, with the supporting sentence
       highlighted. Ported from the website's atlas drawer (Flash-P-AI
       src/app/atlas/_shared.tsx) — same shape and behaviour, but plain CSS and
       vanilla JS instead of framer-motion + React, because the Studio is one
       offline file and must stay that way. */
    .drawer-ovl {
      position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.42);
      backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .22s ease;
    }
    .drawer-ovl.show { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; right: 0; top: 0; z-index: 41; height: 100%; width: 100%; max-width: 30rem;
      display: flex; flex-direction: column; border-left: 1px solid var(--border);
      background: var(--card); box-shadow: -8px 0 28px rgba(0,0,0,.20);
      transform: translateX(100%); transition: transform .28s cubic-bezier(.32,.72,0,1);
    }
    @media (min-width: 1200px) { .drawer { max-width: 34rem; } }
    @media (prefers-reduced-motion: reduce) { .drawer, .drawer-ovl { transition: none; } }
    .drawer.show { transform: translateX(0); }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); flex: none;
    }
    .drawer-head .lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .drawer-head .x { border: none; background: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
    .drawer-head .x:hover { background: var(--secondary); }
    .drawer-body { padding: 16px; overflow: auto; flex: 1; font-size: 13px; line-height: 1.55; }
    .drawer-body h2 { margin: 0 0 4px; font-size: 16px; line-height: 1.35; }
    .drawer-body .claim { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }
    .drawer-body .meta { color: var(--muted); font-size: 12px; margin: 2px 0 12px; }
    .drawer-body .meta a { border-bottom: 1px dotted currentColor; text-decoration: none; }

    .evbadge {
      display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700;
      padding: 2px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap;
    }
    .evbadge.verified   { color: #15803d; border-color: rgba(21,128,61,.45);  background: rgba(21,128,61,.10); }
    .evbadge.repaired   { color: #b45309; border-color: rgba(180,83,9,.45);   background: rgba(180,83,9,.10); }
    .evbadge.quarantine { color: #b91c1c; border-color: rgba(185,28,28,.45);  background: rgba(185,28,28,.10); }
    html.dark .evbadge.verified { color: #4ade80; } html.dark .evbadge.repaired { color: #fbbf24; }
    html.dark .evbadge.quarantine { color: #f87171; }

    .evnote { font-size: 12px; color: var(--muted); border-left: 2px solid var(--border); padding-left: 10px; margin: 10px 0; }
    .evquote {
      border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent);
      background: color-mix(in srgb, var(--primary) 7%, transparent);
      border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-style: italic;
    }
    .evquote .cap { font-style: normal; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: block; margin-bottom: 6px; }

    .evtabs {
      display: inline-flex; gap: 2px; border: 1px solid var(--border); border-radius: 8px;
      padding: 2px; font-size: 12px; margin: 6px 0 8px; background: color-mix(in srgb, var(--secondary) 55%, transparent);
    }
    .evtabs button { border: none; background: none; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--muted); }
    .evtabs button.active { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.10); }
    .evtabs button:disabled { opacity: .42; cursor: not-allowed; }
    .evtext {
      max-height: 46vh; overflow: auto; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; background: color-mix(in srgb, var(--secondary) 28%, transparent);
      position: relative;   /* so a highlight's offsetTop is measured against this box */
    }
    .evtext p { margin: 0 0 9px; } .evtext p:last-child { margin-bottom: 0; }
    .evtext h4 { margin: 14px 0 5px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .evtext h4:first-child { margin-top: 0; }
    mark.ev { background: color-mix(in srgb, var(--primary) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

    /* ---- evidence view (table of every claim) ---- */
    #view-evidence { display: none; overflow: auto; padding: 18px 22px 40px; }
    #view-evidence.show { display: block; }
    #view-evidence h1 { margin: 0 0 4px; font-size: 20px; }
    .ev-sub { color: var(--muted); font-size: 12.5px; margin-bottom: 14px; }
    .ev-tallies { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .ev-filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; font-size: 12px; }
    .ev-filter .pill { border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-weight: 600; background: var(--card); }
    .ev-filter .pill.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    /* The count inside a pill is secondary to its label — until the pill is active,
       where it has to ride the inverted background rather than stay grey. */
    .ev-filter .pill .qt { opacity: .65; font-weight: 500; }
    .ev-filter .pill.active .qt { color: var(--primary-fg); opacity: .8; }
    /* Separates the two independent choices: which kind of claim, which status. */
    .ev-filter .pill-sep { width: 1px; align-self: stretch; margin: 0 5px; background: var(--border); }
    /* Species: italic because it is a binomial, and amber when the claim comes from an
       organism other than the one being modelled — the one case a reader must not miss. */
    .sp { font-style: italic; white-space: nowrap; }
    .sp.foreign { color: var(--warn, #b45309); font-weight: 600; font-style: italic; }
    .chip.sp.foreign { border-color: var(--warn, #b45309); }
    .spcell { white-space: nowrap; }
    .evwrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 11px; background: var(--card); }
    .evtable { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; }
    .evtable th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 1px solid var(--border); padding: 8px 10px; white-space: nowrap; }
    .evtable td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent); vertical-align: top; }
    .evtable tbody tr { cursor: pointer; }
    .evtable tbody tr:hover { background: var(--secondary); }
    .evtable tbody tr:last-child td { border-bottom: none; }
    .evtable .cl { font-family: ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
    .evtable .qt { color: var(--muted); }
    .ev-empty { border: 1px dashed var(--border); border-radius: 11px; padding: 30px; text-align: center; color: var(--muted); }
    /* the Visual Propagation view fills the main area like the other views */
    #view-prop.show { display: flex; }
    .prop-host { flex: 1; min-height: 0; display: flex; padding: 12px; }
    .propcta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .propcta .crumb { font-size: 11.5px; }
    /* the no-run-yet state sits in the middle rather than stretching the whole pane */
    .prop-host > .empty { margin: auto; align-self: center; max-width: 560px; padding: 28px 32px; }
    /* ---- Visual Propagation ------------------------------------------------ */
    .prop-root { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
    .prop-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .prop-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .prop-title strong { font-size: 15px; }
    .prop-sub { font-size: 12px; color: var(--muted); }
    .prop-toggles { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .prop-check { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg); cursor: pointer; }
    .prop-check input { accent-color: var(--primary); }

    /* The stage is the whole body of the view: canvas on the left, one scrolling sidebar on
       the right. The sidebar scrolls internally so narration growing never resizes the canvas. */
    .prop-stage { flex: 1 1 auto; min-height: 0; display: flex; gap: 0; }
    .prop-canvaspane { flex: 1; min-width: 0; min-height: 0; display: flex; }
    .prop-canvas { position: relative; flex: 1; min-width: 0; min-height: 0;
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
    .prop-svg { width: 100%; height: 100%; display: block; touch-action: none; }
    .prop-node { cursor: pointer; outline: none; }
    .prop-node:focus-visible rect:first-child { display: block !important; }

    .prop-zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column;
      gap: 3px; padding: 4px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .prop-zoombtn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      border: 0; background: transparent; color: var(--fg); border-radius: 6px; cursor: pointer;
      font-size: 14px; line-height: 1; }
    .prop-zoombtn:hover { background: var(--secondary); }
    .prop-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      pointer-events: none; border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); padding: 3px 11px; font-size: 11px; color: var(--muted); }

    .prop-divider { flex: 0 0 9px; cursor: col-resize; position: relative; border: 0;
      background: transparent; align-self: stretch; }
    .prop-divider::after { content: ''; position: absolute; left: 50%; top: 8px; bottom: 8px;
      width: 2px; transform: translateX(-50%); border-radius: 2px; background: var(--border); }
    .prop-divider:hover::after, .prop-divider.on::after, .prop-divider:focus-visible::after { background: var(--primary); }
    .prop-divider:focus-visible { outline: none; }
    /* Everything that is not the canvas lives in one scrolling column on the right, so the
       transport sits beside the network it drives instead of spanning the full width. */
    .prop-side { flex: 0 0 38%; min-width: 280px; min-height: 0; display: flex;
      flex-direction: column; gap: 8px; overflow-y: auto; overscroll-behavior: contain;

    .prop-chart { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;

    .prop-charthead h3 { margin: 0; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: var(--muted); }
    .prop-modes { margin-left: auto; display: flex; gap: 4px; }
    .prop-chartlegend { display: flex; flex-wrap: wrap; gap: 2px 9px; margin-bottom: 4px; }
    .prop-chip { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none;
      padding: 0 2px; font-size: 10.5px; color: var(--fg); cursor: pointer; }

    .prop-chipsw { width: 14px; height: 3px; border-radius: 999px; flex: none; }
    .prop-chipname { font-family: ui-monospace, Menlo, Consolas, monospace; }

    .prop-plot { flex: 1; min-height: 90px; }
    .prop-plotsvg { display: block; }
    .prop-plotempty { height: 100%; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 12px; color: var(--muted); }

    .prop-panel { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }

    .prop-card { border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 10px; }
    .prop-cardhead { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }

    .prop-info { font-size: 11px; color: var(--muted); cursor: help; }

    .prop-warn { margin: 8px 0 0; border-radius: 7px; padding: 7px; font-size: 11.5px;

    .prop-link { border: 0; background: none; color: var(--primary); font-size: 11px;
      font-weight: 600; cursor: pointer; margin-left: auto; }

    .prop-movername { border: 0; background: none; padding: 0; cursor: pointer;

    .prop-movername:hover { color: var(--primary); text-decoration: underline; }

    .prop-legend { border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 7px 11px; }
    .prop-legend-row { display: flex; align-items: center; gap: 12px; }
    .prop-legend-main { flex: 1; min-width: 0; }
    .prop-legend-bar { height: 10px; width: 100%; border: 1px solid var(--border); border-radius: 3px; }
    .prop-legend-ticks { margin-top: 2px; display: flex; justify-content: space-between;
      font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .prop-legend-size { display: flex; align-items: flex-end; gap: 4px;
      border-left: 1px solid var(--border); padding-left: 12px; flex: none; }
    .prop-legend-swatch { display: inline-block; border: 1px solid var(--border);
      background: var(--secondary); border-radius: 2px; }
    .prop-legend-sizelabel { margin-left: 2px; font-size: 9.5px; color: var(--muted); }
    .prop-legend-cap { margin: 4px 0 0; font-size: 10.5px; line-height: 1.35; color: var(--muted); }

    .prop-controls { border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 11px; }
    .prop-phase { margin-bottom: 9px; border-radius: 7px; padding: 5px 9px; font-size: 11.5px; font-weight: 600; }
    .prop-phase-wave { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
    .prop-phase-relax { background: var(--secondary); color: var(--muted); }
    .prop-phase-steady { background: var(--secondary); color: var(--fg); }

    .prop-btnrow { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .prop-iconbtn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: transparent; color: var(--fg);
      border-radius: 7px; cursor: pointer; font-size: 13px; line-height: 1; }
    .prop-iconbtn:hover:not(:disabled) { background: var(--secondary); }
    .prop-iconbtn:disabled { opacity: .4; cursor: default; }
    .prop-next { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 13px;

    .prop-next:hover:not(:disabled) { opacity: .9; }
    .prop-next:disabled { opacity: .4; cursor: default; }
    .prop-next-chev { font-size: 15px; line-height: 1; }

    .prop-speed-label { color: var(--muted); }
    .prop-pill { border: 1px solid var(--border); background: transparent; color: var(--fg);
      border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .prop-pill.on { border-color: var(--primary); background: var(--primary); color: var(--primary-fg); }

    .prop-scrubwrap { margin-top: 11px; }
    .prop-scrub { width: 100%; height: 6px; cursor: pointer; accent-color: var(--primary); }
    .prop-readout { margin-top: 5px; display: flex; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
    .prop-steptext { font-weight: 600; color: var(--fg); }

    @media (prefers-reduced-motion: reduce) {
      .prop-root * { animation: none !important; transition: none !important; }
    }
  </style>

<body data-view="browse">
  <div id="topbar">
    <span class="brand"><span class="flask">&#9879;</span> FLASH-P Studio</span>

      <button class="btn" id="nav-prop" style="display:none" title="Watch the perturbation propagate">Visual Propagation</button>
      <button class="btn" id="nav-theme" title="Toggle dark mode">&#9680;</button>

  <main>
    <!-- BROWSE -->
